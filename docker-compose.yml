services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: playerhub
      POSTGRES_USER: playerhub
      POSTGRES_PASSWORD: playerhub
    ports:
      # 5433 on the host so it does not collide with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playerhub -d playerhub"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    environment:
      DATABASE_URL: postgres://playerhub:playerhub@db:5432/playerhub
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
