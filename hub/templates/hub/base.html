<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Player Evaluation Hub{% endblock %}</title>
  <style>
    :root { --ink: #1c2430; --muted: #66707d; --line: #dfe3e8; --bg: #f6f7f9; --accent: #0b5cad; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header.site { background: #14202e; color: #fff; }
    header.site .inner { max-width: 1080px; margin: 0 auto; padding: 12px 20px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
    header.site a { color: #fff; }
    header.site .brand { font-weight: 700; font-size: 17px; }
    header.site form { margin-left: auto; display: flex; gap: 6px; }
    input[type=search] { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; min-width: 240px; }
    button { padding: 7px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 60px; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    h2 { margin: 32px 0 10px; font-size: 18px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
    th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); background: #fafbfc; }
    th.l, td.l { text-align: left; }
    tr:last-child td { border-bottom: 0; }
    tr.total td { font-weight: 600; background: #fafbfc; }
    .score { font-weight: 700; }
    .headline { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
    .headline .big { font-size: 46px; font-weight: 800; line-height: 1; }
    .parts { display: flex; gap: 24px; flex-wrap: wrap; }
    .parts div span { display: block; }
    .pills { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
    .pills a { padding: 4px 11px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); font-size: 13px; }
    .pills a.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .ids { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
    .empty { padding: 14px 16px; background: #fff; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="site">
    <div class="inner">
      <a class="brand" href="{% url 'hub:home' %}">Player Evaluation Hub</a>
      <a href="{% url 'hub:leaderboard' %}">Leaderboards</a>
      <form action="{% url 'hub:search' %}" method="get">
        <input type="search" name="q" value="{{ query|default:'' }}" placeholder="Search players" aria-label="Search players">
        <button type="submit">Search</button>
      </form>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
